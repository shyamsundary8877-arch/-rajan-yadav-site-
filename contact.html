  <main class="container">
    <section class="section">
      <h1>Contact</h1>
      <p class="muted">This is a simple form UI. For real messages, we can connect Formspree / Google Forms.</p>

      <form class="card" onsubmit="fakeSubmit(event)">
        <label class="label">Name</label>
        <input class="input" required placeholder="Your name" />

        <label class="label">Email</label>
        <input class="input" type="email" required placeholder="you@example.com" />

        <label class="label">Message</label>
        <textarea class="input" rows="5" required placeholder="Write your message..."></textarea>

        <button class="btn" type="submit">Send</button>
        <p id="contactMsg" class="muted"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> rajan.yadav</span>
      <span class="muted">Contact page</span>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    setYear();
  </script>
</body>
